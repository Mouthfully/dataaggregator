# Supabase project configuration.
#
# `project_id` is the local project name the CLI uses; it is NOT the hosted project ref, which is
# supplied by `supabase link` and lives outside the repository. It matches the settled product
# name, and the brand guard match-tests it against `packages/brand/src/brand.ts` rather than
# ban-scanning it -- so this line cannot drift from the brand file without failing the build.
# Renaming it is a one-line change with no data consequence, unlike the hosted ref.
#
# The 2026-09-12 product rename demonstrated that -- see docs/marketplane/53-the-rename.md. This
# line and the brand file changed together because the guard refuses to let them disagree, while
# the hosted project kept its ref and every applied migration with it. The hosted project's
# DISPLAY NAME was changed separately, in the dashboard, and is not represented in this repository.
#
# The guard caught an earlier draft of this very comment for naming the product: only the value on
# the line below is allowlisted, never the rest of the file.
project_id = "uniplain"

[db]
port = 54322
major_version = 16

[db.migrations]
schema_paths = []

[auth]
enable_signup = true
enable_confirmations = true

# No site_url or additional_redirect_urls here. Both need the domain, which is unresolved, and both
# are read at runtime from the environment (see packages/brand's siteUrl). Committing a guess would
# put a wrong redirect URI in front of Google's OAuth verification, which specification section 3.5
# records as unbounded -- documented at 3-5 days, observed at over ten weeks. Restarting it is the
# most expensive avoidable mistake in the plan.

[api]
enabled = true
port = 54321
# `app` is deliberately absent: PostgREST exposes only what is listed here, and the tenancy helpers
# in `app` are a privilege boundary, not an API. The two functions the edge needs are in `public`.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323
