# The repository's own gate. Everything the kickoff requires before a push -- lint, typecheck,
# unit tests, build -- plus the repository guards.
#
# CI verifies; the platforms deploy. Vercel's Git integration builds apps/web and Cloudflare
# Workers Builds builds each Worker from its own root directory, so there is no deploy job here.
#
# ALL GUARDS ENFORCE. They make the repository's single-source and cross-package invariants
# executable rather than promises in a document, so they fail the build like any other check.
# Four of them have documented escape hatches for cases where the thing they ban is the point:
# `brand-guard-ignore:`, `tokens-guard-ignore:`, `copy-guard-ignore:` and
# `claim-source-guard-ignore:`, on the offending line or the one above it, each requiring a reason.
# Reach for the hatch with a reason, never by widening an exempt list.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No version pinned here: pnpm/action-setup reads "packageManager" from package.json,
      # which is the one place the pnpm version is declared.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # cache: pnpm caches the pnpm content-addressable store, keyed on pnpm-lock.yaml.
      # It must come after pnpm is installed -- setup-node shells out to `pnpm store path`.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint .

      # Biome has no `--check` flag: bare `biome format` IS the check, exiting non-zero on any
      # file it would reformat. `--write` is the one that changes files.
      - name: Format check
        run: pnpm exec biome format .

      # Per-workspace tsconfigs, deliberately: apps/web needs the DOM lib and apps/api-edge needs
      # @cloudflare/workers-types, and the two collide on fetch/Request/Response/caches.
      - name: Typecheck
        run: pnpm -r typecheck

      # Every package with tests, not just the Worker. apps/api-edge runs under real workerd via
      # @cloudflare/vitest-pool-workers rather than jsdom, which needs vitest 4.x -- the pool peers
      # ^4.1.0 and vitest 5 breaks it. That pin lives in pnpm-workspace.yaml's catalog and is
      # enforced at install time by strict-peer-dependencies.
      - name: Test
        run: pnpm -r test

      # Both apps, not just the web one. @cloudflare/vitest-pool-workers uses its own transform
      # pipeline rather than wrangler's deploy bundle, so a broken wrangler.jsonc or an esbuild
      # bundling failure passes the test step and only surfaces at deploy. `pnpm -r build` covers
      # apps/web (next build) and apps/api-edge (wrangler deploy --dry-run); packages with no
      # build script are skipped.
      - name: Build
        run: pnpm -r build

      # Every guard runs even when a step above failed, so its output is always visible on the
      # run. `!cancelled()` rather than `always()`: a cancelled run should stop, not carry on.
      - name: Brand guard
        if: ${{ !cancelled() }}
        run: node scripts/check-brand.mjs

      - name: Tokens guard
        if: ${{ !cancelled() }}
        run: node scripts/check-tokens.mjs

      # Brand is intentionally a leaf, so it cannot import connectors to build its source claim.
      # This guard keeps the claim's source mirror equal to directories with a client + normaliser.
      - name: Capability guard
        if: ${{ !cancelled() }}
        run: node scripts/check-capabilities.mjs

      # The dictionary guard. The canonical vocabulary exists twice -- packages/contract as TypeScript,
      # the schema as PostgreSQL enums -- and neither can import the other, so drift between them
      # is invisible until a customer's number goes missing rather than a build going red.
      - name: Dictionary guard
        if: ${{ !cancelled() }}
        run: node scripts/check-dictionary.mjs

      # claim() throws on an unknown or withheld id, but only for text that goes through it. This
      # catches the sentence typed straight into the JSX, which renders like an approved promise and
      # passes every other gate. A heuristic, so it is narrow on purpose -- see the script header.
      - name: Inline-copy guard
        if: ${{ !cancelled() }}
        run: node scripts/check-copy.mjs

      # Every claim cites specification sections and the changelog records which sections override
      # which; nothing cross-checked the two, and `connectors` cited 11.9 for four rounds after
      # 11A.14 replaced it. Enforcing within the override's recorded scope, reporting outside it.
      - name: Superseded-citation guard
        if: ${{ !cancelled() }}
        run: node scripts/check-claim-sources.mjs

  # Row-level security is the whole tenant-isolation guarantee, so it is a regression gate rather
  # than a one-off check someone once ran. `supabase start` needs Docker-in-Docker and a full
  # Supabase stack; this needs a database, so it runs the real migrations against a plain
  # PostgreSQL 16 service with the shim in supabase/tests/00_supabase_shim.sql.
  #
  # A separate job on purpose: it needs no Node toolchain, and a failure here should read as
  # "isolation broke", not as part of a lint run.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image ships a psql, but not necessarily one matching the server. Pin the client
      # to 16 so a version skew never shows up as a confusing migration failure.
      - name: Install psql 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          psql --version

      # Applies every migration in order, then the RLS suite. The suite exits non-zero if any
      # assertion fails, and it asserts from seven principals -- none of them a superuser, because
      # a superuser bypasses RLS and would make the whole thing pass trivially.
      - name: Migrations and RLS suite
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/run-local.sh
